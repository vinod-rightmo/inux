name: Test and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry publishing (for example v0.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: inux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: tools/ix/go.sum
      - name: Test the CLI
        working-directory: tools/ix
        run: go test ./...
      - name: Verify the versioned native build
        shell: bash
        run: |
          version=$(sed -n 's/^  version: "\([^"]*\)".*/\1/p' skills/inux/SKILL.md)
          test -n "$version"
          cd tools/ix
          go build -mod=readonly -trimpath -ldflags "-X ix/internal.Version=$version" -o "$RUNNER_TEMP/ix-smoke.exe" .
          test "$("$RUNNER_TEMP/ix-smoke.exe" --version)" = "ix $version"
      - name: Validate all release packages without publishing
        if: matrix.os == 'ubuntu-latest'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: release --snapshot --clean

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [test, release-please]
    if: >-
      always() && needs.test.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: tools/ix/go.sum
      - name: Verify the reviewed release version and draft
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's/^  version: "\([^"]*\)".*/\1/p' skills/inux/SKILL.md)
          test "$RELEASE_TAG" = "v$version"
          manifest_version=$(jq -er '.["."]' .release-please-manifest.json)
          test "$manifest_version" = "$version"
          is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          test "$is_draft" = true
      - name: Build, upload, and publish the reviewed release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
